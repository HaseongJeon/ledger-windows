<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B5C3E">
<title>전표철 — 매출·지출 관리</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<!-- ══════════ 로그인 ══════════ -->
<section id="view-auth" class="auth" hidden>
  <div class="auth__slip">
    <p class="auth__eyebrow">전표철</p>
    <h1 class="auth__title">매출·지출<br>관리 장부</h1>
    <p class="auth__sub">전장 · 선팅 · 덴트 시공 전표를 계정별로 관리합니다.</p>

    <form id="auth-form" class="auth__form" autocomplete="on">
      <label class="field">
        <span class="field__label">이메일</span>
        <input id="auth-email" type="email" inputmode="email" autocomplete="username" required placeholder="you@example.com">
      </label>
      <label class="field">
        <span class="field__label">비밀번호</span>
        <input id="auth-pass" type="password" autocomplete="current-password" required placeholder="••••••••">
      </label>
      <p id="auth-msg" class="auth__msg" role="status" aria-live="polite"></p>
      <div class="auth__row">
        <button id="auth-submit" class="btn btn--plate" type="submit">로그인</button>
        <button id="auth-signup" class="btn" type="button">회원가입</button>
      </div>
    </form>

    <div class="auth__alt">
      <button id="auth-local" class="linkbtn" type="button">서버 없이 이 기기에서만 쓰기</button>
      <button id="auth-config" class="linkbtn" type="button">Supabase 연결 설정</button>
    </div>
  </div>
</section>

<!-- ══════════ 회원가입 ══════════ -->
<section id="view-signup" class="auth" hidden>
  <div class="auth__slip">
    <p class="auth__eyebrow">전표철</p>
    <h1 class="auth__title">회원가입</h1>
    <p class="auth__sub">계정마다 데이터가 완전히 분리됩니다.</p>

    <form id="signup-form" class="auth__form" autocomplete="on">
      <label class="field">
        <span class="field__label">이메일</span>
        <input id="signup-email" type="email" inputmode="email" autocomplete="username" required placeholder="you@example.com">
      </label>
      <label class="field">
        <span class="field__label">비밀번호</span>
        <input id="signup-pass" type="password" autocomplete="new-password" required placeholder="••••••••">
      </label>
      <label class="field">
        <span class="field__label">비밀번호 확인</span>
        <input id="signup-pass2" type="password" autocomplete="new-password" required placeholder="••••••••">
      </label>
      <p id="signup-msg" class="auth__msg" role="status" aria-live="polite"></p>
      <button id="signup-submit" class="btn btn--plate btn--block" type="submit">가입하기</button>
    </form>

    <div class="auth__alt">
      <button id="signup-back" class="linkbtn" type="button">로그인으로 돌아가기</button>
    </div>
  </div>
</section>

<!-- ══════════ 본 앱 ══════════ -->
<div id="view-app" hidden>

  <!-- 전표철: 탭이 곧 먹지 전표 묶음 -->
  <header class="rail">
    <div class="rail__meta">
      <span id="mode-badge" class="badge">로컬</span>
      <span id="who" class="rail__who"></span>
      <button id="btn-menu" class="iconbtn" type="button" aria-label="설정 메뉴">⋯</button>
    </div>
    <nav class="stack" id="tabstack" role="tablist" aria-label="주요 화면">
      <button class="stack__tab" role="tab" id="tab-slips" aria-controls="panel-slips" data-tab="slips"   data-short="전표"  aria-selected="true">매출 전표</button>
      <button class="stack__tab" role="tab" id="tab-clients" aria-controls="panel-clients" data-tab="clients" data-short="거래처" aria-selected="false">거래처</button>
      <button class="stack__tab" role="tab" id="tab-expense" aria-controls="panel-expense" data-tab="expense" data-short="지출"  aria-selected="false">지출</button>
      <button class="stack__tab" role="tab" id="tab-cal" aria-controls="panel-cal" data-tab="cal" data-short="달력" aria-selected="false">달력</button>
      <button class="stack__tab" role="tab" id="tab-revenue" aria-controls="panel-revenue" data-tab="revenue" data-short="분석"  aria-selected="false">매출 분석</button>
    </nav>
  </header>

  <main class="stage">

    <!-- ────── 1. 매출 전표 ────── -->
    <section class="panel" id="panel-slips" role="tabpanel" aria-labelledby="tab-slips">
      <div class="finder">
        <div class="finder__dates">
          <label class="field field--mini"><span class="field__label">시작일</span><input id="f-from" type="date"></label>
          <span class="finder__tilde">–</span>
          <label class="field field--mini"><span class="field__label">종료일</span><input id="f-to" type="date"></label>
        </div>
        <div class="finder__who">
          <label class="field field--mini"><span class="field__label">상사명</span><input id="f-company" type="search" placeholder="대성모터스"></label>
          <label class="field field--mini"><span class="field__label">딜러명</span><input id="f-dealer" type="search" placeholder="김성호"></label>
          <label class="field field--mini finder__plate"><span class="field__label">차량번호</span><input id="f-plate" type="search" placeholder="12가 3456"></label>
        </div>
        <div class="finder__chips" id="f-types">
          <button class="chip" data-type="전장" type="button">전장</button>
          <button class="chip" data-type="선팅" type="button">선팅</button>
          <button class="chip" data-type="덴트" type="button">덴트</button>
          <button class="chip chip--alt" data-only="unpaid" type="button">미수금만</button>
        </div>
        <div class="finder__quick">
          <button class="ghost" data-range="this-month" type="button">이번 달</button>
          <button class="ghost" data-range="last-month" type="button">지난 달</button>
          <button class="ghost" data-range="this-year" type="button">올해</button>
          <button class="ghost" data-range="all" type="button">전체</button>
          <button class="ghost ghost--x" id="f-reset" type="button">초기화</button>
        </div>
      </div>

      <div class="listhead">
        <span id="slips-count" class="listhead__count">0건</span>
        <div class="listhead__acts">
          <button class="ghost" id="btn-table" type="button">표 보기</button>
          <button class="ghost" id="btn-export-slips" type="button">엑셀 내보내기</button>
        </div>
      </div>

      <div id="slips-list" class="slips"></div>
      <div id="slips-table" class="tablewrap" hidden></div>

      <div class="tally" id="slips-tally"></div>
      <div class="stage__pad"></div>
    </section>

    <!-- ────── 2. 거래처 ────── -->
    <section class="panel" id="panel-clients" role="tabpanel" aria-labelledby="tab-clients" hidden>
      <div class="listhead">
        <label class="field field--mini listhead__grow">
          <span class="field__label">거래처 찾기</span>
          <input id="c-q" type="search" placeholder="상사명">
        </label>
        <button class="ghost" id="btn-export-clients" type="button">엑셀 내보내기</button>
        <button class="btn btn--sm" id="btn-add-slip-c" type="button">신규 전표</button>
      </div>
      <div id="clients-list" class="clients"></div>
      <div class="stage__pad"></div>
    </section>

    <!-- ────── 3. 지출 ────── -->
    <section class="panel" id="panel-expense" role="tabpanel" aria-labelledby="tab-expense" hidden>
      <div class="subbar">
      <nav class="subnav" id="expense-subnav">
        <button class="subnav__b is-on" data-sub="list" type="button">내역</button>
        <button class="subnav__b" data-sub="chart" type="button">그래프</button>
        <button class="subnav__b" data-sub="tax" type="button">세금</button>
        <button class="subnav__b" data-sub="sum" type="button">통합정리</button>
      </nav>
      <button class="btn btn--sm" id="btn-add-exp" type="button">신규 지출</button>
      </div>

      <div class="subpanel" id="sub-list">
        <div class="listhead">
          <span id="exp-count" class="listhead__count">0건</span>
          <div class="listhead__acts">
            <button class="ghost" id="btn-export-exp" type="button">엑셀 내보내기</button>
          </div>
        </div>
        <div id="exp-list" class="exps"></div>
      </div>

      <div class="subpanel" id="sub-chart" hidden>
        <div class="periodbar" id="chart-period"></div>
        <div class="card">
          <h3 class="card__h">지출 구성 <span class="card__note">세금 포함</span></h3>
          <div id="exp-pie" class="pie"></div>
          <div id="exp-legend" class="legend"></div>
        </div>
      </div>

      <div class="subpanel" id="sub-tax" hidden>
        <div class="periodbar" id="tax-period"></div>
        <div id="tax-body"></div>
      </div>

      <div class="subpanel" id="sub-sum" hidden>
        <div class="periodbar" id="sum-period"></div>
        <div id="sum-body"></div>
        <div class="listhead">
          <span class="listhead__count">전체 시트</span>
          <button class="ghost" id="btn-export-all" type="button">통합 엑셀 내보내기</button>
        </div>
      </div>
      <div class="stage__pad"></div>
    </section>

    <!-- ────── 4. 달력 ────── -->
    <section class="panel" id="panel-cal" role="tabpanel" aria-labelledby="tab-cal" hidden>
      <div class="calbar">
        <span class="calbar__side">
          <button class="iconbtn" id="cal-prev" type="button" aria-label="이전 달">‹</button>
        </span>
        <h3 class="calbar__t" id="cal-title"></h3>
        <span class="calbar__side calbar__side--r">
          <button class="iconbtn" id="cal-next" type="button" aria-label="다음 달">›</button>
          <button class="ghost" id="cal-today" type="button">오늘</button>
        </span>
      </div>

      <div id="cal-grid" class="cal"></div>
      <p class="callegend"><span class="callegend__i callegend__i--in">들어온 돈</span><span class="callegend__i callegend__i--out">나간 돈</span><span class="callegend__n">미수금은 실제로 받은 날이 아니라 전표 날짜 기준입니다</span></p>

      <div id="cal-daywrap"></div>
      <div id="cal-notes" class="calnotes"></div>

      <div class="listhead">
        <span class="listhead__count">이 달 일별 집계</span>
        <button class="ghost" id="btn-export-cal" type="button">엑셀 내보내기</button>
      </div>

      <div class="tally" id="cal-month"></div>
      <div class="stage__pad"></div>
    </section>

    <!-- ────── 5. 매출 분석 ────── -->
    <section class="panel" id="panel-revenue" role="tabpanel" aria-labelledby="tab-revenue" hidden>
      <div class="periodbar" id="rev-period"></div>
      <div class="card">
        <h3 class="card__h">작업 종류별 매출</h3>
        <div id="rev-pie" class="pie"></div>
        <div id="rev-legend" class="legend"></div>
      </div>
      <div id="rev-breakdown"></div>
      <div class="listhead">
        <span class="listhead__count">작업별 집계</span>
        <button class="ghost" id="btn-export-rev" type="button">엑셀 내보내기</button>
      </div>
      <div class="stage__pad"></div>
    </section>
  </main>

</div>

<!-- ══════════ 모달 ══════════ -->
<div class="sheetwrap" id="modal" hidden>
  <div class="sheetwrap__scrim" data-close></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal__head">
      <h2 class="modal__title" id="modal-title"></h2>
      <button class="iconbtn" data-close type="button" aria-label="닫기">✕</button>
    </header>
    <div class="modal__body" id="modal-body"></div>
    <footer class="modal__foot" id="modal-foot"></footer>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="config.js"></script>
<script type="module" src="assets/app.js"></script>
</body>
</html>
